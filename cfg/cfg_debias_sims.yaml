
defaults:
  - local_system   : generic_lab
  - file_system    : common_fs
  - pipeline       : assembly_sim
  - scenario       : scenario
  - splits         : 1-1
  - model/sim      : sim
  - model/analysis : basic_analysis
  - override hydra/job_logging: custom_log
  - _self_

dataset_name: "${map_fields}_${scenario.nside}_${splits.name}_monopole"
working_dir : "Simulation_Working/"
hydra:
  run:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S}
  sweep:
    dir        : Logs/${now:%Y-%m-%d-%H-%M-%S} 
    subdir     : ${hydra.job.num}                
                                              
  verbose          : false
nside          : 512
detectors      : [44, 70, 100, 143, 217, 353, 545, 857]
map_fields     : "I"
nside_sky      : 1024
preset_strings : ["d1", "s4", "f1", "a1", "cib1", "ksz1", "tsz1"]
# preset_strings : ["d9", "s4", "f1", "a1", "co1", "cib1", "ksz1", "tsz1", "rg1"]
min_obs_beam   : null